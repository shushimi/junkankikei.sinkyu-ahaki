<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>循環器系 過去問マスター</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- TOPページ (Phase 1) -->
    <div id="top-page" class="page">
        <header>
            <h1>循環器系 過去問学習</h1>
            <div class="disclaimer">
                【注意】AIを活用して過去問の抽出から解答解説まで作成しています。間違いがあっても責任はとれませんので、自己責任でご活用ください。
            </div>
        </header>

        <section class="category-section">
            <button class="btn review-btn" onclick="startQuiz('review')">
                復習問題 (<span id="review-count">0</span>問)
            </button>

            <h3>鍼灸過去問</h3>
            <div class="grid">
                <button class="btn" onclick="startQuiz('ana_1_17')">解剖 1-17回</button>
                <button class="btn" onclick="startQuiz('ana_18_34')">解剖 18-34回</button>
                <button class="btn" onclick="startQuiz('phy_1_17')">生理 1-17回</button>
                <button class="btn" onclick="startQuiz('phy_18_34')">生理 18-34回</button>
            </div>

            <h3>あはき過去問</h3>
            <div class="grid">
                <button class="btn" onclick="startQuiz('ahaki_1_17')">第1-17回</button>
                <button class="btn" onclick="startQuiz('ahaki_18_34')">第18-34回</button>
            </div>
        </section>
    </div>

    <!-- 学習画面 (Phase 2) -->
    <div id="quiz-page" class="page hidden">
        <nav>
            <button class="back-btn" onclick="goHome()">← 戻る</button>
            <span id="quiz-progress">0/0</span>
        </nav>
        <div id="question-container">
            <p id="question-text"></p>
            <div id="options-container"></div>
        </div>
        <div id="feedback-container" class="hidden">
            <div id="result-label"></div>
            <div id="explanation-text"></div>
            <button id="next-btn" class="btn" onclick="nextQuestion()">次の問題へ</button>
        </div>
    </div>

    <!-- 完了画面 -->
    <div id="result-page" class="page hidden">
        <div class="complete-msg">
            <h2>終了！</h2>
            <p>このカテゴリが完了しました。</p>
            <button class="btn" onclick="goHome()">TOPへ戻る</button>
        </div>
    </div>

    <!-- 全データファイルの読み込み -->
    <!-- QuizData という1つの箱に各ファイルからデータを追加していきます -->
    <script>const QuizData = {};</script>
    <script src="data/ana_1_17.js"></script>
    <script src="data/ana_18_34.js"></script>
    <script src="data/phy_1_17.js"></script>
    <script src="data/phy_18_34.js"></script>
    <script src="data/ahaki_1_17.js"></script>
    <script src="data/ahaki_18_34.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
